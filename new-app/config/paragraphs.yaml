# Notice, sample letter, Excess Summary, and recap headings.
# Action Required headings are in config/action_required.yaml.

notices:
  - id: I
    heading: Failed Compliance Testing
    extra: For current-method testing
    must_include:
      - Excess Return Notice
      - Qualified Non-Elective Contribution
      - ADP/ACP test is
      - Form W-4R
