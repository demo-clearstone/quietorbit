# Action Required / notice rules from TEST23.docx (MOA 401(k) Editing/Review).
# Decisions are JSON only until PDF modification is applied.

rules:
  - id: A
    section: Compliance Failure Paragraph
    keep_when:
      all:
        - field: returns_required
          equals: true
        - any_true: [fail_402g, fail_415]
        - field: fail_402g_after_deadline
          not_true: true
    else: remove

  - id: B
    section: PRIOR Wording
    keep_when:
      all:
        - field: testing_method
          equals: PRIOR
        - field: returns_required
          equals: true
        - any_true: [adp_failed, acp_failed]
        - field: adp_reclassified
          not_true: true
    else: remove

  - id: C
    section: CURRENT Wording
    keep_when:
      all:
        - field: testing_method
          equals: CURRENT
        - field: returns_required
          equals: true
        - any_true: [adp_failed, acp_failed]
        - field: adp_reclassified
          not_true: true
    else: remove

  - id: D
    section: After 12 Months Current Wording
    keep_when:
      all:
        - field: testing_method
          equals: CURRENT
        - field: after_12_months
          equals: true
        - field: returns_required
          equals: true
        - any_true: [adp_failed, acp_failed]
        - field: adp_reclassified
          not_true: true
    else: remove

  - id: E
    section: After 12 Months Prior Wording
    keep_when:
      all:
        - field: testing_method
          equals: PRIOR
        - field: after_12_months
          equals: true
        - field: returns_required
          equals: true
        - any_true: [adp_failed, acp_failed]
        - field: adp_reclassified
          not_true: true
    else: remove

  - id: F
    section: Top Heavy Wording
    keep_when:
      all:
        - field: top_heavy
          equals: true
    else: remove

  - id: G
    section: No Action Message
    keep_when:
      all:
        - field: has_action_required
          equals: false
    else: remove

  - id: H
    section: Variance Paragraph
    keep_when:
      all:
        - field: variance_report
          equals: true
    else: remove

  - id: I
    section: ADP/ACP Failure Notice (CURRENT)
    keep_when:
      all:
        - field: testing_method
          equals: CURRENT
        - field: returns_required
          equals: true
        - any_true: [adp_failed, acp_failed]
        - field: after_12_months
          not_true: true
    else: remove

  - id: J_ADP
    section: Sample Letter ADP
    keep_when:
      all:
        - field: returns_required
          equals: true
        - field: adp_failed
          equals: true
    else: remove

  - id: J_ACP
    section: Sample Letter ACP
    keep_when:
      all:
        - field: returns_required
          equals: true
        - field: acp_failed
          equals: true
    else: remove

  - id: K
    section: Sample Letter 402(g)
    keep_when:
      all:
        - field: fail_402g
          equals: true
        - field: returns_required
          equals: true
        - field: fail_402g_after_deadline
          not_true: true
    else: remove

  - id: L
    section: Sample Letter 415
    keep_when:
      all:
        - field: fail_415
          equals: true
    else: remove

  - id: M
    section: Contributions Action Required
    keep_when:
      all:
        - field: contributions_required
          equals: true
    else: remove

  - id: ES
    section: Excess Summary Report
    keep_when:
      all:
        - field: keep_excess_summary
          equals: true
    else: remove

  - id: Y1
    section: Recap no HCE
    keep_when:
      all:
        - field: hce_current
          not_true: true
        - field: hce_future
          not_true: true
    else: remove

  - id: Y2
    section: Recap PRIOR testing
    keep_when:
      all:
        - field: testing_method
          equals: PRIOR
        - field: safe_harbor
          not_true: true
        - any_true: [hce_current, hce_future]
    else: remove

  - id: Y3
    section: Recap CURRENT testing
    keep_when:
      all:
        - field: testing_method
          equals: CURRENT
        - field: safe_harbor
          not_true: true
        - any_true: [hce_current, hce_future]
    else: remove

  - id: Y4
    section: Recap Safe Harbor
    keep_when:
      all:
        - field: safe_harbor
          equals: true
    else: remove

  - id: Y5
    section: Recap HCE current no future
    keep_when:
      all:
        - field: hce_current
          equals: true
        - field: hce_future
          equals: false
    else: remove

  - id: Y6
    section: Recap catch-up
    keep_when:
      all:
        - field: catchup_disallowed
          not_true: true
    else: remove

  - id: Y7
    section: Recap top heavy
    keep_when:
      all:
        - field: top_heavy
          equals: true
    else: remove

  - id: Y8
    section: Recap per-payroll match
    keep_when:
      all:
        - field: per_payroll_match
          equals: true
    else: remove

