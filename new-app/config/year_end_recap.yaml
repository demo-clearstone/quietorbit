# Year End Recap page. The page heading in the package is Important Information.

rules:
  - id: Y1
    section: Year End Recap, no highly compensated employees
    keep_when:
      all:
        - field: hce_current
          not_true: true
        - field: hce_future
          not_true: true
    else: remove

  - id: Y2
    section: Year End Recap, prior year testing
    keep_when:
      all:
        - field: testing_method
          equals: PRIOR
        - field: safe_harbor
          not_true: true
        - any_true: [hce_current, hce_future]
    else: remove

  - id: Y3
    section: Year End Recap, current year testing
    keep_when:
      all:
        - field: testing_method
          equals: CURRENT
        - field: safe_harbor
          not_true: true
        - any_true: [hce_current, hce_future]
    else: remove

  - id: Y4
    section: Year End Recap, safe harbor
    keep_when:
      all:
        - field: safe_harbor
          equals: true
    else: remove

  - id: Y5
    section: Year End Recap, HCE this year but not next year
    keep_when:
      all:
        - field: hce_current
          equals: true
        - field: hce_future
          equals: false
    else: remove

  - id: Y6
    section: Year End Recap, age 50 catch-up
    keep_when:
      all:
        - field: catchup_disallowed
          not_true: true
    else: remove

  - id: Y7
    section: Year End Recap, top heavy
    keep_when:
      all:
        - field: top_heavy
          equals: true
    else: remove

  - id: Y8
    section: Year End Recap, per-payroll match
    keep_when:
      all:
        - field: per_payroll_match
          equals: true
    else: remove

recap_bullets:
  - id: Y1
    match: did not have any Highly Compensated Employees
  - id: Y2
    match: prior year data
  - id: Y3
    match: the actual amount the employee can defer
  - id: Y4
    match: Safe Harbor Plan
  - id: Y5
    match: the plan had Highly Compensated Employees for the plan year ending
  - id: Y6
    match: designed to allow participants who were age 50
  - id: Y7
    match: Based on the top heavy testing results
  - id: Y8
    match: employer match contribution is calculated on a participant's compensation
  - id: Y9
    match: not administered by Mutual of America
