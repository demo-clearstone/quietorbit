# 403(b) Editing/Review. Loaded only when the plan type is 403(b).
# A 401(k) package keeps using config/rules.yaml and config/paragraphs.yaml.

package:
  keep_brf: true
  require_410b_report: false
  rewrite_adp_mentions: true
  ignore_adp_results: true
  acp_notice_amount: true


bookmarks:
  HCE/Key: HCE
  ADP/ACP: ACP Test
  BRF: Benefits, Rights and Features test

# Rule ids listed here replace the 401(k) rule with the same id.
# Every other rule is copied from rules.yaml and is not edited here.
rules:
  - id: B
    section: PRIOR ACP Wording
    keep_when:
      all:
        - field: testing_method
          equals: PRIOR
        - field: returns_required
          equals: true
        - field: acp_failed
          equals: true
        - field: adp_reclassified
          not_true: true
    else: remove

  - id: C
    section: CURRENT ACP Wording
    keep_when:
      all:
        - field: testing_method
          equals: CURRENT
        - field: returns_required
          equals: true
        - field: acp_failed
          equals: true
    else: remove

  - id: D
    section: After 12 Months Current Wording
    keep_when:
      all:
        - field: testing_method
          equals: CURRENT
        - field: after_12_months
          equals: true
        - field: returns_required
          equals: true
        - field: acp_failed
          equals: true
    else: remove

  - id: E
    section: After 12 Months Prior Wording
    keep_when:
      all:
        - field: testing_method
          equals: PRIOR
        - field: after_12_months
          equals: true
        - field: returns_required
          equals: true
        - field: acp_failed
          equals: true
    else: remove

  - id: I
    section: ACP Failure Notice (CURRENT)
    keep_when:
      all:
        - field: testing_method
          equals: CURRENT
        - field: returns_required
          equals: true
        - field: acp_failed
          equals: true
        - field: after_12_months
          not_true: true
    else: remove

  - id: J_ADP
    section: Sample Letter ADP
    keep_when:
      all:
        - field: plan_type
          equals: 401k
    else: remove

  - id: Y10
    section: Recap special catch-up
    keep_when:
      all:
        - field: special_catchup_disallowed
          not_true: true
    else: remove

# Heading specs listed here replace every 401(k) spec with the same id.
paragraphs:
  action_required_headings:
    - id: B
      heading: IMMEDIATE ACTION REQUIRED - ACP TEST FAILURE
      variant: PRIOR
      block_excludes: unless QNEC
    - id: C
      heading: IMMEDIATE ACTION REQUIRED - ACP TEST FAILURE
      variant: CURRENT
      block_contains: unless QNEC
      must_include:
        - unless QNEC contributions will be made
        - Excess Summary
        - Form W-4P
    - id: D
      heading: IMMEDIATE ACTION REQUIRED - ACP CURRENT METHOD TEST FAILURE - AFTER 12-MONTHS
    - id: E
      heading: IMMEDIATE ACTION REQUIRED - ACP PRIOR METHOD TEST FAILURE - AFTER 12-MONTHS
    - id: E
      heading: IMMEDIATE ACTION REQUIRED - ACP PRIOR METHOD TEST FAILURE

  notices:
    - id: I
      heading: Failed Compliance Testing
      extra: Current method testing
      must_include:
        - Excess Return Notice
        - Qualified Non-Elective Contribution
        - ACP test is
        - Form W-4P

  recap_bullets:
    - id: Y10
      match: fifteen or more years of service
